corpus_reality_check:
  note: >-
    Contraste de las 24 CQs contra el cerebro real, medido con survey.py el
    2026-08-31: 301 documentos de conocimiento, 520.497 tokens. NO es el log de
    uso -- mide qué datos EXISTEN, no qué se consulta. El cruce contra el log
    sigue pendiente y es el que fija las 9 `frequency` inferidas.
  responden_hoy: 11
  parciales: 5
  sin_datos: 8
  alcance_del_recuento: >-
    Los tres números de arriba miden las 24 PRIMERAS contra el cerebro real el
    2026-08-31. No se han recalculado con el bloque Agent Zero, y no debe
    hacerse en falso: las ocho nuevas dependen todas de campos que hoy no
    existen -- `resumen`, `procedencia`, `valido_desde`/`valido_hasta` y las
    columnas de log-consultas.md --, así que hoy ninguna responde. El recuento
    se rehace tras la migración del paso 9, que es la pasada que crea esos
    campos, y ese informe es parte de su criterio de aceptación.
  sin_datos_detalle: >-
    Ocho CQs (CQ-27, CQ-28, CQ-29, CQ-32, CQ-34, CQ-40, CQ-43) no tienen datos
    porque `Decision` tiene CERO documentos en el cerebro real, y CQ-36 porque
    `Plan` también. El tipo mejor respaldado por la investigación -- cinco CQs
    lo sostienen -- no se está usando. Eso es un hallazgo de proceso, no de
    esquema: o las decisiones no se registran, o se registran como Reunion o
    Playbook. Hay que averiguarlo antes de dar por buena ninguna de las ocho.
  parciales_detalle: >-
    Cinco CQs dependen de campos que el corpus no tiene todavía: generated y
    verified (CQ-23), status y stale_after (CQ-24), classification (CQ-37),
    respondida_por (CQ-41) y dueño (CQ-39). Los tres primeros son la capa de
    confianza y ciclo de vida de OKF v0.2, ausente entera en un cerebro de v1:
    esperado, y es exactamente lo que la migración del paso 9 añade. Cuatro
    adversariales (ADV-05, ADV-09, ADV-10, ADV-12) dependen de esos mismos
    campos y hoy tampoco son ejercitables.
  tipos_fuera_de_catalogo: >-
    El cerebro medido usa dos tipos propios que no están ni en el catálogo de v1
    ni en nuestro contrato, con 11 documentos entre los dos. Son
    PERSONALIZACIONES DE ESE USUARIO y quedan FUERA DEL ALCANCE de esta
    implementación: no entran al contrato y ninguna CQ tiene que contemplarlos.
    Sus nombres y sus campos no se reproducen aquí -- identifican al sector de
    la organización donde se midió, y este archivo viaja en un starter público.
    Lo que sí es un hallazgo y se conserva: que un cerebro real lleve tipos
    propios VALIDA la decisión de tratar el tipo desconocido como aviso y no
    como error (V4), que es lo que permite que el catálogo del kernel y las
    extensiones de cada usuario convivan.
  glosario: >-
    Ninguna CQ lo sostiene, pero el cerebro real tiene 8 documentos Glosario.
    Cortarlo dejaría huérfanos documentos que alguien escribió a propósito.
    Refuerza declararlo estructural en vez de recortarlo.
  playbook: >-
    23 documentos, el tercer tipo más frecuente. La escisión que pide la
    investigación tiene coste de migración real, no teórico.

open_against_own_usage:
  note: >-
    Lo que ninguna revisión de literatura puede sustituir. CORREGIDO: esto se
    escribió dando por hecho que existía un log de consultas de v1. No existe.
    `log.md` registra escrituras, no preguntas, así que `frequency` no se puede
    cerrar mirando atrás.
  items:
    - "`frequency`: hay que instrumentarlo hacia adelante -- que los skills del paso 8 registren qué se consulta-- o aceptar las 9 marcas `# inferred` como lo que son."
    - "Lo que `log.md` SÍ da: la cadencia de ingesta. Sirve para el punto flojo del veredicto del paso 0, que compara A por ingesta contra B por consulta con un cruce en 8,7."
    - "Las preguntas que hoy se resuelven preguntando a un colega: la necesidad que nunca llega al sistema. Requiere observación, no telemetría."
    - "Las capacidades abandonadas: qué skills de v1 se dejaron de usar por inútiles."
    - "El etiquetado `asked_by` es tentativo: validar observando a esos roles, no extrapolando."
