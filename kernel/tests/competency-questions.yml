# Competency questions -- the acceptance criterion for the data contract.
#
# A competency question is something the brain must be able to answer. They are
# written BEFORE the schema, and the schema is judged by them: if a CQ cannot be
# answered, the schema failed -- not the implementation.
#
# Cutting rule: if no CQ needs a type or a field, it does not enter the contract.
#
# In cut 1 they are answered by hand. In cut 2 each grows a `sql:` key and they
# become the executable test suite over the projection.
#
# STATUS: version 2. Replaces the 14-question draft that was derived from what
# v1's skills already did -- a schema validating itself. These 24 come from a
# literature review of observed behaviour (information seeking, fragmented work,
# personal information management, transactive memory, records management),
# with the evidence hierarchy applied as a weighting filter.
#
# What the literature could NOT settle:
#   - `frequency` on 9 questions, marked `# inferred` where the number is a
#     reasoned guess from general studies rather than a measurement of this role.
#   - `cost_today` likewise where marked.
#   - the `asked_by` labels, which are tentative.
#
# These were left pending "until we cross them against v1's usage log". That log
# DOES NOT EXIST: v1's `log.md` records writes ("quien escribe, loguea"), not
# questions asked. Nothing in v1 records a query. So `frequency` cannot be
# settled by looking backwards -- it has to be instrumented going forward, or
# left as the reasoned guess it is. Recorded here so nobody waits on evidence
# that is never coming.
#
# Eight mismatches against the contract were found and corrected on intake --
# `status=vigente` (the OKF value is `stable`), `estado=vigente` on Decision
# (the value is `aceptada`) and on Sistema, plus three field names that do not
# exist on the types they were attached to. See `intake_corrections` at the end.

version: 3
profile_version: 1

questions:

  # -- work in hand: state, blockage, and what was left open ------------------

  - id: CQ-21
    question: "¿Qué preguntas bloqueantes tengo abiertas hoy y quién es responsable de cada una?"
    asked_by: "rol individual (cualquiera que gestione trabajo propio)"
    types: [Pregunta]
    fields: [estado, bloqueante, responsable, proyecto]
    criterion: "lista de documentos Pregunta con estado=abierta y bloqueante=true; cada fila trae responsable"
    decision: "a quién persigo hoy y a qué reunión llevo cada tema"
    frequency: diaria
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Mark, González & Harris 2005 (CHI): «57% of their working spheres are
      interrupted», reanudación media 25m26s; reconstruir qué quedó abierto es
      necesidad observada. Byström & Järvelin 1995: personas/responsables como
      fuente crece con la complejidad de la tarea.
    cost_today: "reconstruir el estado abierto de memoria o releyendo hilos; coste de reanudación ~25 min por ítem interrumpido (Mark et al. 2005)"
    sql: >-
      select d.title, q.responsable, q.proyecto from pregunta q
      join documentos d on d.path = q.doc
      where q.estado = 'abierta' and q.bloqueante = 1 order by q.proyecto

  - id: CQ-22
    question: "¿Qué preguntas llevan más de N días abiertas sin avance?"
    asked_by: "rol individual"
    types: [Pregunta]
    fields: [estado, fecha-creacion]
    criterion: "Pregunta con estado=abierta y (hoy - fecha-creacion) > N"
    decision: "escalar o cerrar lo estancado antes de que se pudra"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Broder 2002 / query logs: las consultas de estado sobre ítems conocidos
      son una fracción alta. La fragmentación (Mark et al. 2005) explica por qué
      se pierden los ítems abiertos.
    cost_today: "no existe hoy sin rastreo manual; los ítems abiertos se olvidan"
    note: >-
      v1 dispersa los umbrales en prosa (2, 7 y 14 días en cuatro sitios).
      Deben venir de un solo lugar.
    sql: >-
      select d.title, q.fecha_creacion from pregunta q
      join documentos d on d.path = q.doc
      where q.estado = 'abierta'
      and julianday(:hoy) - julianday(q.fecha_creacion) > :dias

  - id: CQ-35
    question: "¿Qué preguntas abiertas no tienen responsable asignado?"
    asked_by: "rol individual / gestión"
    types: [Pregunta]
    fields: [estado, responsable]
    criterion: "Pregunta con estado=abierta y responsable vacío"
    decision: "asignar dueño a lo huérfano antes de que se pierda"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "Mark et al. 2005: los ítems sin dueño se pierden en la fragmentación. Wegner 1987: sin ubicación asignada no hay recuperación."
    cost_today: "no hay señal; el ítem sin dueño desaparece"
    sql: >-
      select d.title, q.proyecto from pregunta q
      join documentos d on d.path = q.doc
      where q.estado = 'abierta' and (q.responsable is null or trim(q.responsable) = '')

  # -- confianza en el propio corpus (campos comunes, no tipos) ---------------

  - id: CQ-23
    question: "¿Qué documentos escribió un agente y todavía no ha confirmado ninguna persona?"
    asked_by: "rol individual (dueño del repositorio)"
    types: []
    fields: [generated, verified]
    criterion: "documentos con generated por un actor agente y verified vacío o sin un actor `human:`"
    decision: "qué reviso antes de fiarme; qué no cito como verdad"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "LongMemEval (Wu et al. 2024): la abstención como capacidad evaluada. FACTUM (arXiv 2601.05866): riesgo de tratar como fiable lo no verificado."
    cost_today: "hoy es imposible distinguir a ojo qué escribió un agente; se asume verdad todo"
    justifies: "campos comunes generated/verified -- no un tipo"
    sql: >-
      select d.path, d.type, d.title, d.generated_by from documentos d
      where d.generated_by not like 'human:%'
      and not exists (select 1 from documentos_verified v
      where v.doc = d.path and v.by like 'human:%')

  - id: CQ-24
    question: "¿Qué documentos pasaron su fecha de caducidad y siguen marcados como vigentes?"
    asked_by: "rol individual"
    types: []
    fields: [status, stale_after]
    criterion: "documentos con status=stable y stale_after < ahora"
    decision: "qué re-verifico o degrado antes de apoyarme en ello"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "Controlling Authority Retrieval (arXiv 2604.14488): «RAG is silent on supersession». NARA/GRS: «destroy when superseded, obsolete»."
    cost_today: "no hay señal hoy; el dato caducado se presenta como vigente"
    justifies: "campos comunes status/stale_after -- no un tipo"
    note: >-
      Solo respondible gracias a OKF v0.2. En v1 la obsolescencia era uno de los
      checks de juicio de /x-curar. Corregido en la entrada: el valor de `status`
      es `stable`, no `vigente` -- `vigente` pertenece a Lineamiento.estado
      (llamado `vigencia` hasta la decisión D-4 del 2026-09-10).
    sql: >-
      select d.path, d.title, d.stale_after from documentos d
      where d.status = 'stable' and d.stale_after is not null
      and d.stale_after < :ahora

  - id: CQ-37
    question: "¿Qué documentos de nivel confidencial o restringido tocan a este proyecto?"
    asked_by: "roles regulados, legal, gestión"
    types: []
    fields: [classification]
    criterion: "documentos con classification en [confidencial, restringido] y proyecto=X en los tipos que declaran proyecto"
    decision: "qué no comparto; qué canal uso"
    frequency: mensual          # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Enterprise AI participant-aware access control (arXiv 2509.14608): exposición no intencionada entre roles. NARA: niveles de confidencialidad."
    cost_today: "revisar a mano la clasificación de cada documento antes de compartir"   # inferred
    justifies: "campo común classification -- no un tipo"
    note: >-
      `proyecto` NO es campo común: lo declaran 8 de los 13 tipos. La CQ filtra
      por él donde exista, y por eso no aparece en `fields`. Corregido en la
      entrada, donde figuraba como si fuera común.
    sql: >-
      select d.path, d.type, d.title, d.classification from documentos d
      join documento_proyecto p on p.doc = d.path
      where d.classification in ('confidential', 'restricted') and p.proyecto = :proyecto

  # -- decisiones: vigencia, supersesión, procedencia, autoría ----------------

  - id: CQ-27
    question: "¿Qué decisiones están vigentes en el proyecto X y cuál es la fuente de cada una?"
    asked_by: "gestión de proyecto/producto"
    types: [Decision]
    fields: [proyecto, estado, sources, fecha]
    criterion: "Decision con proyecto=X y estado=aceptada; cada fila con sources no vacío"
    decision: "sobre qué base actúo; qué cito como acordado"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "Hertzum & Pejtersen 2000: el porqué de la decisión no está en la documentación técnica, por eso se recurre a personas. Controlling Authority Retrieval: la vigencia es la clave, no la relevancia."
    cost_today: "buscar en hilos y actas cuál fue la última decisión y si sigue en pie"
    note: "Corregido en la entrada: el valor de Decision.estado es `aceptada`, no `vigente`."
    sql: >-
      select d.title, dec.fecha, s.resource from decision dec
      join documentos d on d.path = dec.doc
      left join documentos_sources s on s.doc = d.path
      where dec.proyecto = :proyecto and dec.estado = 'aceptada'
      and dec.valido_hasta is null

  - id: CQ-28
    question: "¿Qué decisiones del proyecto X fueron reemplazadas, por cuál y cuándo?"
    asked_by: "gestión de proyecto/producto"
    types: [Decision]
    fields: [valido_hasta, reemplazada_por, fecha]
    criterion: "Decision con valido_hasta no vacío y reemplazada_por no vacío"
    decision: "no reabrir lo ya cerrado; explicar por qué cambió el rumbo"
    frequency: mensual
    answer_shape: lista
    grows_with_n: true
    evidence: "Controlling Authority Retrieval (arXiv 2604.14488): supersesión explícita. LongMemEval (Wu et al. 2024): knowledge-update como categoría."
    cost_today: "no hay cadena de supersesión; se dan por vivas decisiones muertas"
    sql: >-
      select d.title, dec.valido_hasta, dec.reemplazada_por from decision dec
      join documentos d on d.path = dec.doc
      where dec.proyecto = :proyecto and dec.valido_hasta is not null
      and dec.reemplazada_por is not null order by dec.valido_hasta

  - id: CQ-40
    question: "¿Qué decisiones registré yo (o un actor concreto) en este periodo?"
    asked_by: "rol individual"
    types: [Decision]
    fields: [decisores, fecha]
    criterion: "Decision con decisores=actor y fecha dentro del rango del periodo"
    decision: "preparar cierre de periodo / rendición de cuentas"
    frequency: mensual          # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Teevan et al. 2007: «40% of all queries are re-finding queries». Barreau & Nardi 1995: recuperación por autor y tiempo."
    cost_today: "reconstruir qué decidí este trimestre releyendo notas"
    note: >-
      Corregido en la entrada: `periodo` no es campo de Decision (es de
      Iniciativa). El periodo es un rango sobre `fecha`.
    sql: >-
      select d.title, dec.fecha from decision dec
      join documentos d on d.path = dec.doc
      join decision_decisores dd on dd.doc = dec.doc
      where dd.value = :persona and dec.fecha between :desde and :hasta

  - id: CQ-34
    question: "¿Qué decisiones, iniciativas y análisis hay registrados sobre este tema en periodos anteriores?"
    asked_by: "rol individual"
    types: [Decision, Iniciativa, Analisis]
    fields: [proyecto, periodo, estado, fecha]
    criterion: "Decision/Iniciativa/Analisis filtrados por proyecto y periodo anterior"
    decision: "no repetir un intento ya hecho; recuperar el precedente"
    frequency: esporadica
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Hertzum & Pejtersen 2000: se recurre a personas por falta de registro del
      precedente. La versión semántica del borrador («algo PARECIDO», CQ-08) NO
      es una CQ: es juicio de similitud. Esta variante estructural por proyecto
      y periodo sí lo es.
    cost_today: "preguntar a un veterano si «ya se intentó esto»"
    note: >-
      `Analisis` se añadió aquí al escindir Playbook (2026-08-31). No es un tipo
      nuevo buscándose una pregunta: es que ESTA pregunta ya se respondía con
      análisis archivados, y hasta ahora venían tipados como Playbook. Sin esto,
      el tipo escindido nacería huérfano y la regla de corte lo dejaría fuera.
    sql: >-
      select d.type, d.title, i.periodo from documentos d
      join documento_proyecto p on p.doc = d.path
      join iniciativa i on i.proyecto = p.proyecto
      where p.proyecto = :proyecto and i.periodo < :periodo
      and d.type in ('Decision', 'Iniciativa', 'Analisis')

  # -- iniciativas, planes y dependencias ------------------------------------

  - id: CQ-25
    question: "¿En qué estado está cada iniciativa del periodo y qué la bloquea?"
    asked_by: "gestión de proyecto/producto"
    types: [Iniciativa]
    fields: [estado, periodo, proyecto]
    criterion: "lista de Iniciativa del periodo con su estado; join a Pregunta bloqueante por proyecto"
    decision: "qué reporto en la actualización semanal y dónde intervengo"
    frequency: semanal
    answer_shape: tabla
    grows_with_n: true
    evidence: "Mark et al. 2005: los gestores mantienen varias working spheres simultáneas. Byström & Järvelin 1995: el estado de la tarea como necesidad recurrente."
    cost_today: "consolidar el estado de varias iniciativas de memoria o pidiéndolo por chat"
    sql: >-
      select d.title, i.estado,
      (select count(*) from pregunta q
      where q.proyecto = i.proyecto and q.estado = 'abierta' and q.bloqueante = 1)
      as bloqueantes
      from iniciativa i join documentos d on d.path = i.doc where i.periodo = :periodo

  - id: CQ-36
    question: "¿Qué planes tengo cuya última revisión es más antigua que su cadencia esperada?"
    asked_by: "gestión de proyecto/producto"
    types: [Plan]
    fields: [ultima-revision, proyecto, fuente-de-verdad]
    criterion: "Plan con (hoy - ultima-revision) > umbral"
    decision: "qué plan reviso antes de citarlo como fuente de verdad"
    frequency: mensual          # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Controlling Authority Retrieval: la frescura como condición de autoridad. Barreau & Nardi 1995: distinción entre lo working y lo archivado."
    cost_today: "no se sabe si el plan está desactualizado hasta que falla"   # inferred
    note: "Única CQ que sostiene el tipo Plan, y lo sostiene débilmente. Ver type_verdicts."
    sql: >-
      select d.title, pl.ultima_revision, pl.fuente_de_verdad from plan pl
      join documentos d on d.path = pl.doc
      where julianday(:hoy) - julianday(pl.ultima_revision) > :umbral

  - id: CQ-42
    question: "¿Qué iniciativas dependen de este sistema o de esta persona?"
    asked_by: "gestión de proyecto/producto"
    types: [Iniciativa, Sistema, Persona]
    fields: [sistemas, personas, estado]
    criterion: "Iniciativa donde sistemas/personas contiene la entidad"
    decision: "evaluar el impacto si el sistema cae o la persona se va"
    frequency: mensual          # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Change-impact analysis (arXiv 1703.01897): rastreo de dependencias e interlocutores. Wegner 1987: riesgo de perder al dueño del conocimiento."
    cost_today: "análisis de impacto manual e incompleto"
    sql: >-
      select d.title, 'sistema' as via from iniciativa i
      join documentos d on d.path = i.doc
      join iniciativa_sistemas s on s.doc = i.doc where s.value = :sistema
      union all
      select d.title, 'persona' as via from iniciativa i
      join documentos d on d.path = i.doc
      join iniciativa_personas pe on pe.doc = i.doc where pe.value = :persona

  # -- personas: memoria transactiva -----------------------------------------

  - id: CQ-26
    question: "¿Qué le tengo que preguntar o cobrar a esta persona antes de reunirme con ella?"
    asked_by: "gestión de proyecto/producto"
    types: [Pregunta, Persona]
    fields: [responsable, estado, proyecto]
    criterion: "Pregunta con responsable=esta persona y estado=abierta"
    decision: "qué llevo a la reunión; no salir sin cobrar lo pendiente"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "Wegner 1987 (memoria transactiva, «who knows what»). Hertzum & Pejtersen 2000: se busca a la persona que puede explicar o desbloquear."
    cost_today: "se reconstruye de memoria justo antes de la reunión; se olvida cobrar cosas"
    sql: >-
      select d.title, q.proyecto, q.fecha_creacion from pregunta q
      join documentos d on d.path = q.doc
      where q.responsable = :persona and q.estado = 'abierta'

  - id: CQ-31
    question: "¿Quién reporta a quién y qué huecos tiene el organigrama que conozco?"
    asked_by: "rol individual con red de trabajo"
    types: [Persona]
    fields: [reporta-a, rol, equipo]
    criterion: "grafo de Persona por reporta-a; huecos = Persona sin reporta-a o sin rol"
    decision: "a quién escalo; a quién pido aprobación"
    frequency: mensual
    answer_shape: tabla
    grows_with_n: true
    evidence: "Wegner 1987: directorio de expertise. Hertzum & Pejtersen 2000: localizar a la persona correcta."
    cost_today: "preguntar a colegas quién manda en qué; conocimiento tácito"
    sql: >-
      select d.title, pe.rol, pe.equipo, pe.reporta_a,
      case when pe.reporta_a is null or pe.rol is null then 'hueco' else 'completo' end
      as ficha
      from persona pe join documentos d on d.path = pe.doc
      order by ficha, coalesce(pe.reporta_a, '')

  - id: CQ-41
    question: "¿Qué preguntas respondió esta persona y en qué documentos quedó la respuesta?"
    asked_by: "rol individual"
    types: [Pregunta, Persona]
    fields: [respondida_por, estado, fecha-creacion]
    criterion: "Pregunta con respondida_por=persona y estado=respondida"
    decision: "a quién vuelvo por seguimiento; a quién acredito"
    frequency: esporadica       # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Wegner 1987: metamemoria de quién respondió qué. Hertzum 2002: atribución correcta de la fuente."
    cost_today: "recordar quién contestó qué; se pierde la atribución"
    note: "Corregido en la entrada: Pregunta no tiene `fecha`, tiene `fecha-creacion`."
    sql: >-
      select d.title, q.respondida_por from pregunta q
      join documentos d on d.path = q.doc
      where q.respondida_por = :persona and q.estado = 'respondida'

  - id: CQ-39
    question: "¿Qué sistemas son propiedad de esta persona o equipo?"
    asked_by: "rol individual / gestión"
    types: [Sistema, Persona]
    fields: [dueño, categoria, estado]
    criterion: "Sistema filtrado por dueño=persona/equipo"
    decision: "a quién pido acceso o cambios sobre un sistema"
    frequency: mensual          # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Wegner 1987: directorio de «who owns what». Hertzum & Pejtersen 2000: localizar al dueño para desbloquear."
    cost_today: "preguntar por chat de quién es tal sistema"
    sql: >-
      select d.title, s.categoria, s.estado from sistema s
      join documentos d on d.path = s.doc
      where s."dueño" = :persona or s."dueño" = :equipo

  # -- reconstrucción de contexto: tiempo y entidades -------------------------

  - id: CQ-32
    question: "¿Qué documentos tocan a esta persona, sistema o proyecto y en qué rol aparece?"
    asked_by: "rol individual"
    types: [Reunion, Decision, Iniciativa, Sistema]
    fields: [asistentes, decisores, personas, sistemas, proyecto]
    criterion: "documentos donde la entidad aparece en un campo de relación; devolver el campo, que es el rol"
    decision: "reconstruir todo lo que rodea a una entidad antes de actuar"
    frequency: semanal
    answer_shape: tabla
    grows_with_n: true
    evidence: "Dumais et al. 2003 (Stuff I've Seen): personas y tiempo son las claves de recuperación dominantes. Teevan et al. 2007: «40% of all queries are re-finding queries»."
    cost_today: "buscar por texto libre a través de muchos documentos, de forma incompleta"
    sql: >-
      select d.type, d.title, 'asistente' as rol from reunion_asistentes r
      join documentos d on d.path = r.doc where r.value = :persona
      union all select d.type, d.title, 'decisor' from decision_decisores dd
      join documentos d on d.path = dd.doc where dd.value = :persona
      union all select d.type, d.title, 'implicada' from iniciativa_personas ip
      join documentos d on d.path = ip.doc where ip.value = :persona
      union all select d.type, d.title, 'sistema' from iniciativa_sistemas isx
      join documentos d on d.path = isx.doc where isx.value = :sistema

  - id: CQ-33
    question: "¿Qué reuniones tuve con esta persona o sobre este proyecto y en qué fechas?"
    asked_by: "rol individual"
    types: [Reunion]
    fields: [proyecto, fecha, asistentes]
    criterion: "Reunion filtrada por asistente o proyecto, ordenada por fecha"
    decision: "reconstruir el hilo antes de la próxima reunión"
    frequency: semanal
    answer_shape: lista
    grows_with_n: true
    evidence: "Barreau & Nardi 1995: recuperación por localización y tiempo. Dumais et al. 2003: el tiempo como landmark de recuperación."
    cost_today: "buscar en el calendario y en notas dispersas"
    sql: >-
      select d.title, r.fecha from reunion r
      join documentos d on d.path = r.doc
      left join reunion_asistentes a on a.doc = r.doc
      where r.proyecto = :proyecto or a.value = :persona
      group by d.path order by r.fecha desc

  # -- norma, artefactos y procedencia ---------------------------------------

  - id: CQ-30
    question: "¿Qué lineamientos vigentes aplican a este proyecto o área?"
    asked_by: "gestión de proyecto/producto, legal, roles regulados"
    types: [Lineamiento]
    fields: [area, estado, valido_hasta, fuente]
    criterion: "Lineamiento con area coincidente, valido_hasta vacío o futuro, y estado != en-revision"
    decision: "a qué norma me ciño; qué no puedo hacer"
    frequency: mensual
    answer_shape: lista
    grows_with_n: true
    evidence: "Controlling Authority Retrieval: la autoridad la gobierna la vigencia. NARA/IRS: obligación de operar sobre la versión vigente."
    cost_today: "buscar el lineamiento aplicable y verificar que sigue vigente"
    sql: >-
      select d.title, l.area, l.fuente from lineamiento l
      join documentos d on d.path = l.doc
      where l.area = :area and l.estado = 'aprobado'
      and (l.valido_hasta is null or l.valido_hasta > :hoy)

  - id: CQ-29
    question: "¿Qué decisiones afectan a este sistema y cuáles siguen vigentes?"
    asked_by: "gestión de proyecto/producto o ingeniería"
    types: [Sistema, Decision]
    fields: [estado, proyecto]
    criterion: "Decision que referencia al Sistema; filtrar Decision.estado=aceptada"
    decision: "qué restricciones respeto al tocar el sistema"
    frequency: mensual
    answer_shape: lista
    grows_with_n: true
    evidence: "Hertzum 2002: los ingenieros rastrean decisiones sobre artefactos. Change-impact (arXiv 1703.01897): se usan los enlaces para identificar decisiones e interlocutores."
    cost_today: "reconstruir qué se decidió sobre un sistema a lo largo del tiempo"
    note: "Corregido en la entrada: `estado=vigente` no existe ni en Decision ni en Sistema."
    sql: >-
      select d.title, dec.estado, dec.valido_hasta from decision dec
      join documentos d on d.path = dec.doc
      where dec.estado = 'aceptada' and dec.valido_hasta is null
      and dec.doc in (select path from busqueda where busqueda match :termino)

  - id: CQ-38
    question: "¿Qué diagramas existen de este proyecto y cuál es su versión más reciente por clase?"
    asked_by: "ingeniería, gestión de producto"
    types: [Diagrama]
    fields: [proyecto, clase, version]
    criterion: "Diagrama filtrado por proyecto, agrupado por clase, max(version)"
    decision: "qué diagrama uso como referencia y cuál está obsoleto"
    frequency: esporadica       # inferred
    answer_shape: tabla
    grows_with_n: true
    evidence: "Hertzum & Pejtersen 2000: los artefactos de diseño se consultan para reconstruir el porqué. Sostiene la existencia consultiva de Diagrama, aunque débilmente."
    cost_today: "buscar la última versión del diagrama entre varias copias"   # inferred
    note: "Única CQ que sostiene el tipo Diagrama. Ver type_verdicts."
    sql: >-
      select dg.clase, max(dg.version) as version from diagrama dg
      where dg.proyecto = :proyecto group by dg.clase

  - id: CQ-43
    question: "¿Qué insumos archivados sustentan esta iniciativa o decisión y cuál es su origen?"
    asked_by: "roles regulados, legal"
    types: [Insumo, Iniciativa, Decision]
    fields: [origen, formato, proyecto, sources]
    criterion: "Insumo referenciado por la iniciativa o decisión; devolver origen"
    decision: "acreditar procedencia en un contexto de auditoría"
    frequency: esporadica       # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "NARA/IRS: manifiesto de originales y procedencia. Controlling Authority Retrieval: trazar la fuente."
    cost_today: "buscar el original que respalda una afirmación en auditoría"
    note: "Única pregunta que roza a Insumo, y es de procedencia, no de contenido. Ver type_verdicts."
    sql: >-
      select d.title, i.origen, i.formato from insumo i
      join documentos d on d.path = i.doc where i.proyecto = :proyecto

  - id: CQ-44
    question: "¿Qué playbooks (procesos reutilizables) existen para este tipo de tarea o proyecto?"
    asked_by: "rol individual / gestión"
    types: [Playbook]
    fields: [proyecto]
    criterion: "Playbook filtrado por proyecto o etiqueta de proceso; status=stable"
    decision: "reutilizar un proceso ya probado en vez de improvisar"
    frequency: esporadica       # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: "Hertzum & Pejtersen 2000: reutilización de la experiencia de diseño previa."
    cost_today: "recrear un proceso desde cero por no encontrar el playbook"   # inferred
    note: >-
      Separa el uso «proceso reutilizable» del uso «análisis archivado» de
      Playbook, que queda en CQ-34. Corregido en la entrada: el valor de
      `status` es `stable`. Ver type_verdicts: el tipo debe escindirse.
    sql: >-
      select distinct d.title from playbook pb
      join documentos d on d.path = pb.doc
      left join documentos_tags t on t.doc = d.path
      where d.status = 'stable' and (pb.proyecto = :proyecto or t.value = :tema)


  # == Bloque Agent Zero (2026-09-10) =========================================
  # Las ocho que siguen y ADV-13/ADV-14 entran con el plan de implementación de
  # las ideas de Agent Zero Memory. Aprobadas con cuatro correcciones; ver
  # `revision_3_corrections` al final del archivo.

  # -- coste de lectura: qué se abre, cuánto y por qué -------------------------

  - id: CQ-45
    question: "¿Qué proporción de mis consultas se respondió sin abrir ningún documento del cerebro?"
    asked_by: "rol individual (dueño del repositorio)"
    types: []
    fields: [docs-abiertos, modo-consulta]
    criterion: >-
      líneas de log-consultas.md agrupadas por mes, contando las que registran
      cero documentos abiertos y las que registran modo `directa`
    decision: "si la compuerta de intención sobra, si está mal calibrada, o cuánto ahorra"
    frequency: mensual
    answer_shape: tabla
    grows_with_n: false
    evidence: >-
      El propio archivo documenta que `frequency` no se puede cerrar mirando
      atrás porque log.md registra escrituras y no preguntas. Esta CQ existe
      para cerrar esa brecha hacia adelante, que es la única vía que queda.
    cost_today: "no existe; el coste de lectura no se mide, solo se estima"
    note: >-
      No justifica un tipo ni un campo común: justifica extender la línea de
      log-consultas.md con el modo y el conteo de aperturas. `grows_with_n:
      false` es correcto y es el primero del archivo: el log crece con el número
      de consultas, no con el tamaño del cerebro.
      RESUELTO el 2026-09-10 (decisión D-6): el log SE PROYECTA como una
      tabla más, así que esta CQ lleva `sql:` como cualquier otra y T8 no
      necesita excepción. El formato de la línea está declarado en
      `reserved_files["log-consultas.md"].line_format` del contrato y lo
      comprueba V26 -- en el momento en que el proyector la parsea deja de ser
      prosa y pasa a ser una interfaz, y una interfaz sin comprobación es lo que
      este sistema existe para eliminar. Solo se proyectan los CONTEOS: el texto
      de la pregunta no entra en la base.
    sql: >-
      select count(*) as consultas,
      sum(case when completos = 0 then 1 else 0 end) as sin_abrir,
      round(sum(case when completos = 0 then 1.0 else 0.0 end)
      / nullif(count(*), 0), 2) as proporcion
      from consultas

  - id: CQ-46
    question: "¿Cuántos documentos abre una consulta típica, y cuántos de ellos completos?"
    asked_by: "rol individual (dueño del repositorio)"
    types: []
    justifies: "campos comunes resumen/resumen_hash -- no un tipo"
    fields: [docs-abiertos, cuerpos-abiertos, cuerpos-citados]
    criterion: >-
      distribución de docs-abiertos, cuerpos-abiertos y cuerpos-citados sobre
      las líneas de log-consultas.md; el contraste que decide es
      cuerpos-citados / cuerpos-abiertos -- qué proporción de lo que se abrió
      entero acabó sosteniendo alguna afirmación de la respuesta
    decision: "dónde fijar el tope de aperturas, y si el nivel intermedio está sirviendo"
    frequency: mensual
    answer_shape: tabla
    grows_with_n: false
    evidence: >-
      Zhu & Wu 2026, §3.2: la memoria documental jerárquica se lee L0 -> L1 ->
      L2 bajo un tope duro de aperturas de texto completo, para que el lector
      se oriente en lo barato. El tope solo se puede calibrar midiendo.
    cost_today: "no existe; survey.py estima la navegación de índices, no el consumo por consulta"
    note: >-
      Es la CQ que justifica `resumen` como campo redactado y no como
      extracción mecánica de encabezados. Si la distribución muestra que las
      consultas abren cuerpo igual, el resumen no está cumpliendo su función y
      hay que revisar cómo se redacta -- no agregar más niveles.
      LA MÉTRICA DE EFICIENCIA, decidida el 2026-09-10. `cuerpos-citados` sale
      del conjunto de citas que la disciplina de ADV-13 ya obliga a construir:
      un documento abierto entero que no sostiene ninguna afirmación se abrió de
      más. La razón cuerpos-citados/cuerpos-abiertos es el desperdicio medido, y
      es lo que fija el tope con evidencia en vez de con una estimación.
      POR QUÉ EL TOPE ARRANCA EN 5 Y NO EN 2: un tope que aprieta impide
      observar cuántos documentos habría necesitado la consulta. 5 no restringe
      -- survey.py midió el baseline como «abrir 5 documentos» --, y esa es
      exactamente su virtud durante la instrumentación: deja ver la distribución
      real antes de recortarla. El coste de esa decisión es que el ahorro no
      llega hasta que el tope se fije con datos.
      Las dos lecturas que separa la métrica: si se abren 5 y se citan 2 de
      forma sistemática, o el resumen no permite descartar (se arregla cómo se
      redacta) o el agente abre por inercia (se arregla la regla del módulo).
      Se proyecta igual que CQ-45; ver su nota.
    sql: >-
      select round(avg(docs), 1) as docs_vistos,
      round(avg(completos), 1) as abiertos_enteros,
      round(avg(citados), 1) as citados,
      round(sum(citados) * 1.0 / nullif(sum(completos), 0), 2) as aprovechamiento
      from consultas

  # -- la línea de tiempo: cuándo cambió qué -----------------------------------

  - id: CQ-47
    question: "¿Qué pasó en esta iniciativa entre dos fechas, en orden cronológico y con su fuente?"
    asked_by: "rol individual (cualquiera que gestione trabajo propio)"
    types: [Reunion, Decision, Pregunta, Analisis, Plan]
    fields: [fecha, fecha-creacion, ultima-revision, proyecto, title]
    criterion: >-
      una sola lista ordenada por fecha que mezcla los tipos fechados de un
      proyecto; cada fila enlaza a su documento y declara su tipo
    decision: "reconstruir el estado de un trabajo sin releer la carpeta entera"
    frequency: semanal   # inferred
    answer_shape: tabla
    grows_with_n: true
    evidence: >-
      Mark, González & Harris 2005 (CHI): la reanudación tras interrupción es
      la operación cara del trabajo fragmentado. Hertzum & Pejtersen 2000:
      reconstruir el orden de los hechos es parte del coste de retomar.
    cost_today: "abrir cada subcarpeta del proyecto y ordenar de memoria; crece con el proyecto"
    note: >-
      CORREGIDO en la revisión 3. La entrega decía «`fecha` y `proyecto` ya
      existen en los cinco tipos implicados» y es falso: solo Reunion, Decision
      y Analisis declaran `fecha`; Pregunta declara `fecha-creacion` y Plan
      declara `ultima-revision`. Es el mismo desajuste que ya se corrigió una
      vez en CQ-41.
      CONSECUENCIA DE DISEÑO: la vista de eventos NO puede seleccionar por el
      NOMBRE `fecha` -- omitiría dos de los cinco tipos en silencio. Se genera
      sobre todo campo con `data_type: date`, y así un tipo nuevo con fecha
      entra solo de verdad. `proyecto` sí está en los cinco.
    sql: >-
      select fecha, tipo, campo, title, doc from eventos
      where proyecto = :proyecto and fecha between :desde and :hasta

  # -- vigencia: qué valía cuándo ----------------------------------------------

  - id: CQ-48
    question: "¿Qué decisión o lineamiento estaba vigente sobre este tema en una fecha dada?"
    asked_by: "gestión de proyecto/producto, legal, roles regulados"
    types: [Decision, Lineamiento]
    fields: [valido_desde, valido_hasta, estado, reemplazada_por, proyecto]
    criterion: >-
      dada una fecha F, los documentos con valido_desde <= F y valido_hasta
      vacío o posterior a F; más la cadena de sucesión hacia adelante
    decision: "responder por qué se hizo algo con el criterio que regía entonces, no con el de hoy"
    frequency: mensual   # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Barreau & Nardi 1995: el valor de un archivo personal está en poder
      reconstruir el contexto de una decisión pasada, no solo su resultado.
      Para roles regulados, la trazabilidad de la versión superada es requisito
      de auditoría y no comodidad.
    cost_today: "no se puede responder: la supersesión de v1 vive en prosa y no hay vigencia declarada"
    note: >-
      `reemplazada_por` no se reemplaza, se complementa: responde QUÉ sustituyó
      a qué, y es lo que encadena la genealogía. `valido_desde`/`valido_hasta`
      responden DESDE y HASTA cuándo rigió. Son dos ejes distintos.
      RESUELTO el 2026-09-10 (decisión D-4, opción B: el intervalo manda).
      Lineamiento gana `valido_desde`, `valido_hasta` y `reemplazada_por`, y su
      `vigencia` se renombra a `estado`. `proyecto` NO se le añade: un
      lineamiento vive en 02-areas/{area}/ y es de área, no de proyecto -- en
      esta CQ ese campo aplica solo a Decision.
      ATENCIÓN: ocho CQs ya dependen de `Decision`, que tiene cero documentos en
      el cerebro real. Auditar ese hueco antes de construir encima -- ver
      corpus_reality_check.
    sql: >-
      select tipo, title, doc, valido_desde, valido_hasta, reemplazada_por
      from vigencia
      where (valido_desde is null or valido_desde <= :fecha)
        and (valido_hasta is null or valido_hasta > :fecha)
      order by tipo, valido_desde

  - id: CQ-51
    question: "¿Qué reglas caducaron sin que nadie las reemplazara?"
    asked_by: "gestión de proyecto/producto, legal, roles regulados"
    types: [Decision, Lineamiento]
    justifies: "campos valido_desde/valido_hasta en Decision y Lineamiento"
    fields: [valido_hasta, reemplazada_por, estado]
    criterion: "documentos con valido_hasta ya pasado y reemplazada_por vacío"
    decision: "detectar el vacío normativo antes de que alguien decida sin criterio"
    frequency: esporadica
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Es el caso que un modelo derivado de la cadena de supersesión NO puede
      expresar: sin sucesor no hay fecha de cierre, y la regla figura vigente
      para siempre. Kaliciński 2026 sobre ontology drift: el modelo se
      desalinea en silencio mientras las consultas siguen devolviendo
      resultados plausibles.
    cost_today: "no existe; una regla caducada sigue apareciendo como vigente"
    note: >-
      Esta es la CQ que decide entre declarar la vigencia y derivarla. Si se
      rechaza, `valido_desde`/`valido_hasta` no entran y la vigencia vuelve a
      ser una vista sobre `reemplazada_por` -- más barata y estrictamente menos
      expresiva.
      RESUELTO igual que CQ-48: con la opción B, `valido_hasta` sin
      `reemplazada_por` ES la definición de caducado sin reemplazo, así que esta
      CQ deja de necesitar un `estado` que lo diga aparte. Es el caso que la
      opción B expresa mejor que ninguna otra.
    sql: >-
      select tipo, title, doc, valido_hasta from vigencia
      where vigencia = 'caducada' and valido_hasta <= :hoy
      order by valido_hasta desc

  # -- encontrar sin navegar índices -------------------------------------------

  - id: CQ-49
    question: "¿Qué documentos mencionan este término exacto — un identificador, un nombre propio, un sistema?"
    asked_by: "rol individual"
    types: []
    fields: [title, description, resumen]
    criterion: >-
      búsqueda léxica con ranking sobre título, descripción, resumen y cuerpo;
      devuelve rutas ordenadas, nunca contenido
    decision: "qué abrir, y qué documentos hay que actualizar cuando algo cambia"
    frequency: diaria   # inferred
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Teevan et al. 2007: la reconsulta de información ya conocida es una
      fracción alta del uso y se hace por término recordado más que por
      navegación. Zhu & Wu 2026, §5.4: el canal léxico recupera identificadores,
      nombres y términos raros que la similitud semántica difumina.
    cost_today: "navegar índices y abrir candidatos; el coste crece con el cerebro"
    note: >-
      `types: []` a propósito: la pregunta es transversal al catálogo, y no
      justifica ningún campo -- el cuerpo no es un campo de frontmatter. Es la
      única CQ del conjunto que no se responde con SQL sobre frontmatter, y por
      eso es la que justifica el índice de texto.
      DEPENDE de que `resumen` exista. Aprobado el 2026-09-10.
      La ablación de Zhu & Wu (Tabla 7) mide el techo de este canal sin
      vectores densos: léxico solo cuesta 1,8 puntos frente al híbrido, y aun
      así supera a todos los sistemas externos comparados.
    sql: >-
      select b.path, d.type, d.title, bm25(busqueda) as relevancia
      from busqueda b join documentos d on d.path = b.path
      where busqueda match :termino order by relevancia limit 20

  # -- cierre de ciclo ---------------------------------------------------------

  - id: CQ-50
    question: "¿Qué aprendimos en las iniciativas cerradas que siga sirviendo hoy?"
    asked_by: "rol individual / gestión"
    types: [Iniciativa, Decision, Analisis, Lineamiento]
    fields: [estado, periodo, proyecto]
    criterion: >-
      documentos de iniciativas cerradas cuyo contenido fue promovido a un área
      permanente; y el inverso, iniciativas cerradas sin nada promovido
    decision: "qué rescatar antes de archivar, y detectar lo que se archivó en crudo"
    frequency: esporadica
    answer_shape: lista
    grows_with_n: true
    evidence: >-
      Wegner 1987 (memoria transactiva): el conocimiento de un grupo se pierde
      cuando el portador sale del grupo. Un proyecto cerrado es el caso más
      frecuente de esa salida. Zhu & Wu 2026, §3.4: lo aprendido al completar
      una tarea se promueve a memoria persistente en vez de morir con la sesión.
    cost_today: "no existe; el conocimiento del proyecto se archiva junto con él"
    note: >-
      No pide tipo nuevo ni campo nuevo. Pregunta por movimiento entre carpetas
      PARA, que ya es derivable de la ubicación y el estado. `estado` y
      `periodo` los aporta Iniciativa; `proyecto` es la clave de unión. Como en
      CQ-42, CQ-26, CQ-41 y CQ-39, hay un tipo listado que no aporta ninguno de
      los tres campos -- aquí Lineamiento: está por ser destino de promoción,
      no por aportar columnas.
    sql: >-
      select 'promovido' as caso, d.type, d.title, d.path, s.resource as origen
        from documentos d
        join documentos_sources s on s.doc = d.path
        join documento_proyecto p on '/' || p.doc = s.resource
        join iniciativa i on i.proyecto = p.proyecto
        where i.estado = 'entregada' and d.path like '02-areas/%'
      union all
      select 'sin cosechar' as caso, 'Iniciativa' as type, d.title, i.doc as path,
             null as origen
        from iniciativa i join documentos d on d.path = i.doc
        where i.estado = 'entregada'
          and not exists (select 1 from documentos_sources s
                          join documento_proyecto p2 on '/' || p2.doc = s.resource
                          where p2.proyecto = i.proyecto and s.doc like '02-areas/%')
      order by caso, type

  # -- procedencia: cómo entró cada cosa ---------------------------------------

  - id: CQ-52
    question: "¿Qué afirmaciones de este cerebro son lectura directa de una fuente y cuáles son inferencia de un agente?"
    asked_by: "roles regulados, legal, gestión"
    types: []
    justifies: "campo común procedencia -- no un tipo"
    fields: [procedencia, generated, verified]
    criterion: >-
      documentos agrupados por procedencia; y el cruce que importa,
      procedencia=inferido con verified vacío
    decision: "cuánto peso dar a una afirmación, y qué revisar primero"
    frequency: mensual   # inferred
    answer_shape: tabla
    grows_with_n: true
    evidence: >-
      Zhu & Wu 2026, §3.1, postulado P1: la inferencia falible queda impedida
      de corromper la verdad de base «por disciplina de tipo, no por política».
      `actors` responde QUIÉN escribió el documento; no responde CÓMO entró la
      afirmación. Un agente transcribiendo un insumo y un agente infiriendo de
      una discusión son el mismo actor con fiabilidad distinta.
    cost_today: "no se distingue; `generated` mezcla la transcripción fiel con la inferencia"
    note: >-
      Justifica `procedencia` como campo común y no como tipo nuevo. Un tipo
      separado para lo experiencial expresaría lo mismo duplicando plantillas,
      ubicaciones y checks, y solo para sus propios documentos; el enum lo
      expresa en todo el catálogo. Valores: fuente, dialogo, inferido, manual.
      CORREGIDO en la revisión 3: la entrega lo llamaba `origen`, y ese nombre
      ya está tomado dos veces con dos tipos de dato distintos --
      `Iniciativa.origen` es un enum y `Insumo.origen` un enlace a /raw/--, y
      `derived_files.GOALS.md` agrupa por él. `procedencia` no colisiona con
      nada y es el término del paper.
    sql: >-
      select procedencia, count(*) as documentos,
      sum(case when exists (select 1 from documentos_verified v
      where v.doc = documentos.path and v.by like 'human:%')
      then 1 else 0 end) as verificados_por_persona
      from documentos group by procedencia order by documentos desc

# Adversarial questions: things the system must NOT be able to answer wrongly.
# Tested like the rest, but they pass when the system refuses or warns, not
# when it answers. ADV-01..04 are inherited from the draft and carry no
# literature backing; ADV-05..12 come from documented failure modes.

# ADV-13 y ADV-14 no describen un estado de los datos, sino una conducta de quien
# responde: «solo se cita lo que se abrió» y «una inferencia no se presenta con el
# peso de una lectura». Ninguna consulta puede verlas -- la primera la sostienen V22
# y la sesión, la segunda `procedencia` y la regla de T11. Exentas por naturaleza, no
# por pereza, y declaradas aquí para que el test de T8 no tenga que saberlo de memoria.
sql_exempt: [ADV-01, ADV-02, ADV-13, ADV-14]
# ADV-01 y ADV-02 se escribieron primero como consultas sobre la vista `vigencia`
# y resultaron VACUAS: preguntaban si el CASE se contradice a sí mismo, y un CASE
# generado no puede. Lo que prohíben —presentar como vigente algo que caducó, o
# como acordado algo reemplazado, «sin decirlo»— es conducta de quien responde, no
# un estado de los datos. Su mitad estructural está garantizada por construcción:
# la vista `vigencia` no deja obtener la lista sin la columna que dice el estado
# derivado, así que el dato para advertir siempre está delante. Exentas por la misma
# razón que ADV-13 y ADV-14, y no por no encontrarles una consulta.
#
# Lo que SÍ salió de escribirlas: `Lineamiento.estado` tenía el valor `vigente`,
# que afirmaba una vigencia que ese campo ya no decide. Renombrado a `aprobado`.

adversarial:

  - id: ADV-01
    question: "¿Cuál es el lineamiento vigente sobre X?"
    must_not: "devolver un lineamiento con valido_hasta ya pasado, o con estado 'en-revision', como si estuviera plenamente vigente"
    harm: "se cumple una norma muerta, o se incumple la viva"
    evidence: "heredada del borrador; sin respaldo de literatura propio. Solapa con ADV-08."

  - id: ADV-02
    question: "¿Qué decidimos sobre X?"
    must_not: "devolver una decisión con valido_hasta pasado sin decir que dejó de regir, ni por cuál fue reemplazada"
    harm: "se actúa sobre una decisión muerta creyéndola vigente"
    evidence: "heredada del borrador; ADV-08 y CQ-28 la respaldan indirectamente."

  - id: ADV-03
    question: "¿A quién le reporta esta persona?"
    must_not: "inferir la jerarquía de un correo, un organigrama parcial o el contexto"
    harm: "jerarquía inventada; se escala al interlocutor equivocado"
    evidence: "heredada del borrador. Reforzada por ADV-11."
    sql: >-
      select pe.doc, pe.reporta_a from persona pe
      where pe.reporta_a is not null and trim(pe.reporta_a) <> ''
      and not exists (select 1 from documentos d
      where '/' || d.path = pe.reporta_a or d.path = pe.reporta_a)

  - id: ADV-04
    question: "¿Cuál es el estado de este proyecto?"
    must_not: >-
      responder desde un documento cuyo stale_after ya venció sin advertir
      que el dato puede estar obsoleto
    harm: "decisión tomada sobre datos caducados"
    evidence: "heredada del borrador. Reforzada por ADV-10."
    sql: >-
      select path, title, stale_after from documentos
      where status = 'stable' and stale_after is not null and stale_after < :ahora

  - id: ADV-05
    question: "¿Me pasas los datos de compensación / el documento restringido del proyecto X?"
    must_not: "devolver contenido de un documento con classification=restringido o confidencial cuando el nivel no corresponde al contexto de la petición"
    harm: "fuga entre niveles de confidencialidad; exposición de datos que el solicitante no debe ver, con riesgo legal y de confianza"
    evidence: >-
      Enterprise AI participant-aware access control (arXiv 2509.14608): la
      exposición no intencionada entre roles es inevitable sin control por
      participante. Material de proveedores de seguridad [calidad baja]: solo
      nombra el modo de fallo, no su prevalencia.
    sql: >-
      select path, type, classification from documentos
      where type in ('Persona', 'Insumo') and classification not in ('confidential', 'restricted')

  - id: ADV-06
    question: "¿Quién decidió cerrar la iniciativa X?"
    must_not: "atribuir la decisión a una persona que no figura en el campo decisores; inventar o inferir el decisor"
    harm: "se responsabiliza a quien no decidió, dañando relaciones y rendición de cuentas"
    evidence: "FACTUM (arXiv 2601.05866): «misattribution of information to an incorrect or fabricated source». Hertzum & Pejtersen 2000: el quién y el porqué no están documentados y se infieren mal."
    sql: >-
      select dd.doc, dd.value from decision_decisores dd
      where not exists (select 1 from documentos d
      where ('/' || d.path = dd.value or d.path = dd.value)
      and d.type = 'Persona')

  - id: ADV-07
    question: "¿Ya acordamos usar el proveedor Y?"
    must_not: "presentar como acordado (Decision con estado=aceptada) lo que solo consta como propuesta o como pregunta abierta"
    harm: "se actúa sobre un compromiso inexistente, con coste contractual y de reputación"
    evidence: "LoCoMo (Maharana et al. 2024): 446 preguntas adversariales sobre inferencia no soportada. Evidence override en RAG (arXiv 2604.09174)."
    note: "Corregido en la entrada: el estado que significa «acordado» es `aceptada`, no `vigente`."
    sql: >-
      select d.title, dec.estado from decision dec
      join documentos d on d.path = dec.doc
      where dec.estado = 'propuesta'
      and (dec.valido_hasta is not null or dec.reemplazada_por is not null)

  - id: ADV-08
    question: "¿Cuál es la política vigente sobre Z?"
    must_not: "responder desde un Lineamiento cuyo valido_hasta ya pasó, o que fue reemplazado, sin advertir el estado"
    harm: "lineamiento derogado presentado como vigente"
    evidence: "Controlling Authority Retrieval (arXiv 2604.14488): «standard retrieval systems fail on it structurally»; RAG «silent on supersession». NARA/GRS."
    sql: >-
      select tipo, title, doc from vigencia
      where reemplazada_por is not null and valido_hasta is null

  - id: ADV-09
    question: "¿Qué sabemos del proyecto X? (resumen general)"
    must_not: "sintetizar como hechos verificados contenido generado por un agente y no confirmado (generated sin verified)"
    harm: "prosa generada por IA presentada como conocimiento verificado; se propaga error no revisado como verdad institucional"
    evidence: "LongMemEval (Wu et al. 2024): abstención como capacidad. «Inference stated as fact» = 17,54% de spans de alucinación añadidos (arXiv 2603.27752)."
    sql: >-
      select v.doc, v.by from documentos_verified v where v.by not like 'human:%'

  - id: ADV-10
    question: "¿Este documento sigue siendo válido para basar mi decisión?"
    must_not: "responder afirmativamente desde un documento con stale_after vencido sin marcar la caducidad"
    harm: "información caducada presentada como vigente"
    evidence: "Controlling Authority Retrieval (arXiv 2604.14488). K-FinHallu (arXiv 2605.29523): «outdated reference documents» como categoría real de error en despliegue."
    sql: >-
      select path, title, stale_after, status from documentos
      where stale_after is not null and stale_after < :ahora and status <> 'deprecated'

  - id: ADV-11
    question: "¿Cuál es la jerarquía / quién manda entre A y B?"
    must_not: "inferir una relación reporta-a que no está declarada en el campo"
    harm: "se asume una autoridad inexistente"
    evidence: "Wegner 1987: el directorio de «who knows what» debe ser explícito. Evidence override (arXiv 2604.09174): relleno de huecos con inferencia no soportada."
    sql: >-
      select a.doc as persona_a, b.doc as persona_b from persona a
      join persona b on ('/' || b.doc = a.reporta_a or b.doc = a.reporta_a)
      where ('/' || a.doc = b.reporta_a or a.doc = b.reporta_a)

  - id: ADV-12
    question: "Dame la fuente de esta decisión."
    must_not: "devolver una decisión sin su campo sources, o fabricar una referencia de fuente"
    harm: "decisión sin procedencia trazable; en auditoría o disputa no se puede sostener"
    evidence: "Provenance-aware research artifacts (arXiv 2604.16208): la pérdida de procedencia equivale a decaimiento del conocimiento. FACTUM (arXiv 2601.05866)."
    sql: >-
      select s.doc, s.resource from documentos_sources s
      where s.resource is null or trim(s.resource) = ''


  - id: ADV-13
    question: "¿Puede un entregable citar un documento que quien lo escribió nunca abrió?"
    must_not: >-
      emitir un entregable cuyas citas incluyan rutas no leídas durante la
      sesión que lo produjo, o rutas que no existen en el bundle
    harm: >-
      una cita inventada es peor que una afirmación sin fuente: la afirmación
      sin fuente se lee con desconfianza, la cita falsa se lee con confianza
    evidence: >-
      Zhu & Wu 2026, Definición 2: la disciplina de cita se impone por
      construcción -- la interfaz del lector no ofrece canal para citar
      material no abierto -- y el lector que no puede ensamblar el conjunto de
      citas se abstiene. Lo que aquí es norma de prosa, allí es sintaxis.
    note: >-
      Solo la mitad estructural es automatizable (V22: la ruta citada resuelve
      a un documento del bundle). «Solo se cita lo que se abrió» no lo ve el
      validador, que no tiene la sesión; queda como regla del módulo de
      consulta. Decirlo importa: esta adversarial NO se ejercita con SQL.
      Cubre la deuda que kernel/AGENTS.md ya reconoce sobre `# Citations`:
      «nada lo comprueba todavía».

  - id: ADV-14
    question: "¿Puede una inferencia de un agente presentarse con el mismo peso que un dato leído de una fuente?"
    must_not: >-
      devolver en la misma lista y sin distinción un documento con
      procedencia=fuente y uno con procedencia=inferido que nadie ha verificado
    harm: >-
      es el modo de fallo que nombra P1: la inferencia contamina la verdad de
      base. Una vez mezcladas, ninguna revisión posterior las separa, porque la
      señal que las distinguía no se guardó
    evidence: >-
      Zhu & Wu 2026, §3.1, postulado P1 y Tabla 2: la memoria factual leída de
      fuente y la experiencial inferida se segregan por tipo, con ciclos de
      vida distintos.
    note: >-
      Depende de que CQ-52 se apruebe y `procedencia` exista. Aprobadas ambas el
      2026-09-10. Se ejercita con V25 y con la regla del módulo de consulta, no
      con SQL.

# The cutting rule applied, type by type. A type with no CQ is not automatically
# out: it may exist for structural reasons. What it may not do is go unexamined.
# `sustained` = some CQ needs it as a subject. `structural` = it exists for
# conformance or provenance, and that is declared, not inferred from silence.

type_verdicts:
  Iniciativa:  {verdict: sustained,  by: [CQ-25, CQ-34, CQ-42]}
  Reunion:     {verdict: sustained,  by: [CQ-32, CQ-33]}
  Decision:    {verdict: sustained,  by: [CQ-27, CQ-28, CQ-29, CQ-34, CQ-40], note: "el tipo mejor respaldado"}
  Pregunta:    {verdict: sustained,  by: [CQ-21, CQ-22, CQ-26, CQ-35, CQ-41]}
  Persona:     {verdict: sustained,  by: [CQ-26, CQ-31, CQ-39, CQ-41]}
  Sistema:     {verdict: sustained,  by: [CQ-29, CQ-39, CQ-42]}
  Lineamiento: {verdict: sustained,  by: [CQ-30], adversarial: [ADV-01, ADV-08]}
  Plan:        {verdict: weak,       by: [CQ-36], note: "una sola CQ, y de frescura. Revisar contra el log de uso; si no hay consulta real, degradar"}
  Diagrama:    {verdict: weak,       by: [CQ-38], note: "consulta navegacional real pero marginal. Se producen más de lo que se consultan"}
  Insumo:      {verdict: structural, by: [CQ-43], note: "la única pregunta que lo toca es de procedencia en auditoría, no de contenido. Existe por el manifiesto de originales"}
  Indice:      {verdict: structural, by: [], note: "ninguna CQ lo necesita como sujeto. Es el índice generado que sirve a las preguntas que no crecen con N, y OKF exige frontmatter tipado"}
  Glosario:    {verdict: structural, by: [], decided: 2026-08-31, note: "RESUELTO: se queda, declarado estructural. Ninguna CQ lo sostiene y no declara campos requeridos, pero sirve leyéndolo, no consultándolo -- igual que Insumo e Indice. Cortarlo no simplificaba nada: OKF exige `type` en todo archivo de conocimiento, producción tiene 8, y ningún otro tipo aloja la definición de un término"}
  Playbook:    {verdict: sustained, by: [CQ-44], decided: 2026-08-31, note: "RESUELTO: escindido. Se queda con el sentido de PROCESO reutilizable, que es como lo nombra CQ-44 y como lo usan los 23 documentos de producción. El corte: un Playbook se SIGUE, un Analisis se CONSULTA"}
  Analisis:    {verdict: sustained, by: [CQ-34], decided: 2026-08-31, note: "La otra mitad de la escisión: el análisis archivado, que se consulta como precedente. Nombre elegido lejos de Informe, Entregable y Recurso, que son huecos aún sin bautizar. MIGRACIÓN: hay que triar a mano los 23 Playbook de producción; los `analisis-inicial.md` que crea /x-nueva-iniciativa son Analisis"}

# Two entries carry PENDIENTE DE DECISIÓN because acting on them changes the
# type catalogue, and the catalogue is what every brain in production already
# uses. Neither is a decision this file can take on its own.


# Method notes that outlive the research.

method:
  no_type_saved_by_empty_types: >-
    Ninguna CQ usa `types: []` para salvar un tipo del corte. Las tres que lo
    llevan (CQ-23, CQ-24, CQ-37) justifican campos comunes, no tipos, y lo
    declaran en su clave `justifies`.
  grows_with_n: >-
    Las 24 CQs están marcadas `true`: todas devuelven conjuntos que escalan con
    el corpus. Es deliberado, no un descuido. Las preguntas de conjunto acotado
    fueron cortadas antes por fallar `decision`, y lo que no crece con N se
    resuelve con el índice generado, no con la capa de consulta.
  dropped_from_draft:
    - id: CQ-07
      was: "¿Qué decidimos sobre X y por qué? ¿Qué alternativas se descartaron?"
      why: >-
        El porqué y las alternativas viven en prosa; Hertzum & Pejtersen 2000
        confirman que no se documentan de forma estructurada. Su parte
        estructural ya está en CQ-27 y CQ-28. Fuera del contrato, como
        recuperación semántica.
    - id: CQ-08
      was: "¿Ya intentamos algo parecido antes? ¿Con qué resultado?"
      why: >-
        «Parecido» es juicio de similitud semántica y ninguna consulta
        estructurada lo resuelve. Su parte estructural es ahora CQ-34.

