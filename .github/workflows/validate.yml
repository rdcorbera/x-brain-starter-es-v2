name: validar cerebro

# El pre-commit valida lo que cambia; esto valida el bundle completo, que es
# donde se ven los índices y derivados desincronizados. Sin `pip install`:
# la capa determinista es stdlib pura a propósito.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    # Windows además de Linux: el entorno donde esto va a correr es solo
    # Windows, y ahí los finales de línea y el intérprete se comportan distinto.
    # Un fallo que solo aparece en el banco no sirve de nada.
    # Piso y techo, en los dos sistemas: 3.11 es lo mínimo que el código
    # tolera, 3.14 es lo que conviene instalar. Probar solo uno deja que el
    # código se pudra por arriba o suba el piso sin querer por abajo.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash   # Git Bash en Windows: un solo dialecto de script para ambos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `python`, no `python3`: es el único nombre que setup-python garantiza
      # en las tres plataformas. En Windows `python3` puede no existir o caer
      # en el stub de Microsoft Store.
      - name: Artefactos generados al día
        run: |
          python kernel/bin/brain.py generate
          git diff --exit-code -- kernel/schema .claude .github/prompts \
            || { echo "::error::Hay artefactos generados desactualizados. Corre 'brain.py generate' y commitea."; exit 1; }

      # `generate` NO debe tocar el bundle: materializar un cerebro es `init`, y
      # el starter versiona un cerebro/ vacío a propósito. Si esto falla, la
      # separación se rompió y el repo del usuario recibiría un diff espurio.
      - name: "`generate` no escribe dentro del cerebro"
        run: |
          git diff --exit-code -- cerebro \
            || { echo "::error::'brain.py generate' escribió dentro de cerebro/. Eso es trabajo de 'init'."; exit 1; }

      - name: Round-trip -- generador y validador se comprueban entre sí
        run: python kernel/tests/test_roundtrip.py

      # Los dos preflight tienen piso 3.9, no 3.11: corren en la máquina de
      # destino ANTES de que se instale nada. Si alguien les cuela sintaxis
      # moderna, dejan de correr donde tienen que correr.
      - name: Los preflight siguen compilando contra su propio piso (3.9)
        run: |
          for f in kernel/bin/survey.py kernel/bin/sqlite-probe.py; do
            python -c "import ast,pathlib,sys; ast.parse(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'), feature_version=(3,9))" "$f"
            echo "  $f OK"
          done

      # La sonda no la ejercita nada más, y 322 líneas que nadie corre se
      # pudren. Aquí además vigila algo que no controlamos: si un build futuro
      # de Python dejara de traer FTS5, nos enteramos ahora y no al empezar el
      # corte 2. Corre contra un directorio temporal, nunca contra el repo.
      - name: Sonda SQLite -- ¿sigue siendo viable la proyección del corte 2?
        run: python kernel/bin/sqlite-probe.py "$(python -c 'import tempfile;print(tempfile.mkdtemp())')"

      # El cerebro del starter está vacío a propósito, así que validarlo aquí no
      # probaría nada. Lo que sí hay que probar es lo que le pasa al usuario:
      # `init` es lo primero que corre, y su salida tiene que validar limpio. Si
      # no, lo primero que un cerebro nuevo reporta es un defecto en sí mismo.
      - name: Un cerebro recién inicializado valida limpio
        run: |
          destino="$(python -c 'import tempfile;print(tempfile.mkdtemp())')/cerebro"
          python kernel/bin/brain.py init "$destino"
          python kernel/bin/brain.py validate "$destino"
          python kernel/bin/brain.py govern "$destino"

      # Y si este repositorio SÍ tiene conocimiento (el de un usuario, no el
      # starter), se valida entero: es donde se ven los índices y derivados
      # desincronizados, que el pre-commit no puede ver.
      - name: Validar el bundle, si tiene contenido
        run: |
          if ! ls cerebro/*.md >/dev/null 2>&1; then
            echo "::notice::cerebro/ vacío (es el starter). Se omite."
            exit 0
          fi
          python kernel/bin/brain.py validate cerebro
          python kernel/bin/brain.py govern cerebro
